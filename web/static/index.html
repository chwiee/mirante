<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirante · Agentes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%233987e5'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233987e5' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span class="name">Mirante</span>
    <span class="live" id="live"><span class="live-dot"></span><span id="live-txt">conectando…</span></span>
    <button class="connect-btn" id="connect-btn">+ Conectar agente</button>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<main class="stage">
  <section class="map-wrap" aria-label="Mapa mental dos agentes">
    <svg id="map" role="img" aria-label="Agentes, MCP servers e tools"></svg>
    <div class="legend" aria-label="Legenda">
      <span><i class="lg-dot ok"></i>ok</span>
      <span><i class="lg-dot err"></i>erro de tool</span>
      <span><i class="lg-dot unc">?</i>incerteza</span>
      <span><i class="lg-dot hal">!</i>alucinação</span>
      <span><i class="lg-ghost"></i>tool inexistente</span>
      <span class="muted" id="window-lbl"></span>
    </div>
  </section>
  <aside class="feed" aria-label="Requisições ao vivo">
    <h2>Ao vivo</h2>
    <ol id="feed"></ol>
  </aside>
</main>

<footer class="ticker" aria-label="Últimos alertas">
  <span class="ticker-lbl">Alertas</span>
  <div class="ticker-track" id="ticker"><span class="muted">nenhum alerta na janela</span></div>
</footer>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div id="drawer-title"></div>
    <button class="icon-btn" id="drawer-close" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script src="app.js"></script>
</body>
</html>
